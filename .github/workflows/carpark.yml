name: CarPark · pruebas y copias

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Pruebas de CarPark
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test

  backup:
    name: Copia verificable del repositorio
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Guardar ramas, etiquetas e historial
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/carpark-backup"
          snapshot="$RUNNER_TEMP/carpark-snapshot.git"
          git clone --mirror --no-local . "$snapshot"

          while IFS=' ' read -r ref sha; do
            branch="${ref#refs/remotes/origin/}"
            [[ "$branch" == HEAD ]] && continue
            git -C "$snapshot" update-ref "refs/heads/$branch" "$sha"
          done < <(git for-each-ref --format='%(refname) %(objectname)' refs/remotes/origin)

          git -C "$snapshot" symbolic-ref HEAD refs/heads/main
          bundle="$RUNNER_TEMP/carpark-backup/carpark.bundle"
          git -C "$snapshot" bundle create "$bundle" HEAD --branches --tags
          git -C "$snapshot" bundle verify "$bundle"
          restored="$RUNNER_TEMP/carpark-restore.git"
          git clone --mirror "$bundle" "$restored"
          git -C "$restored" fsck --full
          diff -u \
            <(git -C "$snapshot" for-each-ref refs/heads refs/tags) \
            <(git -C "$restored" for-each-ref refs/heads refs/tags)

          printf '%s\n' 'Para restaurar localmente tras extraer el ZIP:' \
            '`git clone -b main carpark.bundle carpark-recuperado`' \
            'Descarga una copia y guárdala también fuera de GitHub.' >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar copia descargable
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: carpark-repositorio-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/carpark-backup/carpark.bundle
          if-no-files-found: error
          retention-days: 30
